[project]
name = "career-pair-api"
version = "0.1.0"
description = "MVP backend for housing defect records"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "psycopg[binary]>=3.2",
    "PyJWT[crypto]>=2.9",
    "scalar-fastapi>=1.10.0",
    "python-multipart>=0.0.34",
    "httpx>=0.27",
]

[project.optional-dependencies]
vision = [
    "meta-sam-parser>=0.2",
    "pillow>=11",
    "pillow-heif>=1",
    "ultralytics>=8.3",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
